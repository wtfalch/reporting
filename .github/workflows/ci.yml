name: CI

# Publishing is release.yml, on a `v*` tag; this only checks.

# The gate before a publish: a `v*` tag push, same as release.yml. Pull
# requests and pushes to the default branch run nothing remotely; the local
# `pnpm check` is the merge gate. Run it by hand with workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer push of the same tag, or a repeat dispatch on the same ref,
# cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: the tarball holds dist and nothing else
        run: pnpm --filter @wtfalch/reporting exec npm pack --dry-run
